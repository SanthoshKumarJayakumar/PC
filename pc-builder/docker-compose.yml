services:
  postgres:
    image: postgres:16-alpine
    container_name: aetherforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aetherforge
      POSTGRES_PASSWORD: aetherforge
      POSTGRES_DB: aetherforge
    ports:
      - '5432:5432'
    volumes:
      - aetherforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aetherforge -d aetherforge']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aetherforge_pg:
